<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Planner and Board — fake host</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: flex; flex-direction: column; font: 12px/1.4 -apple-system, system-ui, sans-serif; background: var(--border); }
      nav { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--border-strong); }
      nav strong { color: var(--text-muted); font-weight: 600; }
      nav a { color: var(--badge-fg); text-decoration: none; }
      nav a[aria-current="page"] { color: var(--text); font-weight: 600; }
      #stage { flex: 1; min-height: 0; display: flex; }
      #stage > iframe { border: 0; display: block; background: transparent; }
      #stage[data-surface="tab"] > iframe { flex: 1; height: 100%; }
      #stage[data-surface="panel"] > iframe { width: var(--panel-width, 240px); height: 100%; border-right: 1px solid var(--border-strong); }
    </style>
  </head>
  <body>
    <nav data-testid="harness-nav"></nav>
    <div id="stage"></div>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
