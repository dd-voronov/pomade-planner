<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Planner and Board — fake host</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: flex; flex-direction: column; font: 12px/1.4 -apple-system, system-ui, sans-serif; background: #e2e8ec; }
      nav { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; padding: 6px 10px; background: #f1f4f6; border-bottom: 1px solid #cdd6dc; }
      nav strong { color: #5a6b7a; font-weight: 600; }
      nav a { color: #2b6cb0; text-decoration: none; }
      nav a[aria-current="page"] { color: #1f2933; font-weight: 600; }
      #stage { flex: 1; min-height: 0; display: flex; }
      #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(31, 41, 51, 0.28); }
      #overlay[hidden] { display: none; }
      #overlay iframe { border: 0; display: block; width: 420px; height: 220px; border-radius: 10px; box-shadow: 0 4px 16px rgba(31, 41, 51, 0.12); background: transparent; }
      #stage iframe { border: 0; display: block; background: transparent; }
      #stage[data-surface="tab"] iframe { flex: 1; height: 100%; }
      #stage[data-surface="panel"] iframe { width: var(--panel-width, 240px); height: 100%; border-right: 1px solid #cdd6dc; }
      #stage[data-surface="overlay"] { align-items: center; justify-content: center; background: rgba(31, 41, 51, 0.28); }
      #stage[data-surface="overlay"] iframe { width: 420px; height: 220px; border-radius: 10px; box-shadow: 0 4px 16px rgba(31, 41, 51, 0.12); }
    </style>
  </head>
  <body>
    <nav data-testid="harness-nav"></nav>
    <div id="stage"></div>
    <div id="overlay" hidden></div>
    <script type="module" src="./harness.ts"></script>
  </body>
</html>
